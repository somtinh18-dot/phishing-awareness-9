<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Awareness Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e9eef5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 15px #0002;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .warning {
            color: #6e4545;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Login account </h2>

        <p>Cybersecurity</p>

        <input type="text" placeholder=" username">

        <input type="password" placeholder=" password">

        <button onclick="showWarning()">Login now</button>

        <p class="warning" id="message"></p>
    </div>

    <script>
        function showWarning() {
            document.getElementById("message").innerHTML =
                "⚠️ Security Training! Never enter your password into suspicious links.";
        }
    </script>

</body>

</html>
